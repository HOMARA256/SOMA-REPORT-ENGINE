services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "apps/api/src/healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 3
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["npm", "run", "jobs", "--workspace", "apps/api"]
    env_file: .env
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 8s
      retries: 3
